<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>SKINOMAKASE</title><style>[hidden]{display:none!important}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f3f3;color:#111;font:16px -apple-system,sans-serif}main{width:min(340px,85vw)}h1{font-size:22px}a{display:block;margin:20px 0;color:inherit}#open{padding:16px;background:#111;color:white;border-radius:12px;text-align:center;text-decoration:none}p{line-height:1.6}</style></head><body><main><h1>SKINOMAKASE</h1><p id="hint">Open your conversation in the SKINOMAKASE app.</p><a id="open" hidden>Open the app</a><a href="https://apps.apple.com/app/id6832430549">App Store</a><p id="fallback">You can also open the app → your account → your conversation. Sign in with the same Google or Apple account.</p></main><script>
(()=>{const q=new URLSearchParams(location.search),key=q.has('thread')?'thread':'booking',id=q.get(key),open=document.getElementById('open');if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||'')){open.href='com.skinomakase.app://session?'+key+'='+encodeURIComponent(id);open.hidden=false;}if(navigator.language.startsWith('ko')){document.documentElement.lang='ko';document.getElementById('hint').textContent='SKINOMAKASE 앱에서 대화를 확인해 주세요.';open.textContent='앱에서 열기';document.getElementById('fallback').textContent='앱 → 사람 아이콘 → 해당 대화에서도 확인할 수 있어요. 같은 Google 또는 Apple 계정으로 로그인해 주세요.';}})();
</script></body></html>
