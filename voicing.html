<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Voicing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{ --bg:#E7E7E7; --pill:#F4F4F4; --pill2:#DCDCDC; --line:#B9B9B9; --ink:#111111; --mute:#7A7A7A; --red:#D71921; --wk:#F1F1F1; --wk-line:#C9C9C9; --bk:#141414; --w:30px; color-scheme:light }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;padding-block:28px 40px;padding-inline:20px;display:flex;flex-direction:column;gap:22px}
  .mono{font-family:"Space Mono",monospace}
  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  h1{margin:0;font-family:"DotGothic16","Space Mono",monospace;font-weight:400;font-size:34px;letter-spacing:.06em;line-height:1;text-transform:uppercase}
  header{display:flex;flex-direction:column;gap:8px}
  h1 .mark{width:64px;height:64px;display:block}
  header .cap{display:flex;justify-content:space-between}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pill{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;min-height:44px;padding:0 18px;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill.soft{background:var(--pill);border-color:var(--pill)}
  .pill.soft.on{background:var(--ink);border-color:var(--ink)}
  .pill:focus-visible,.key:focus-visible,input:focus-visible,.node:focus-visible,#dial:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .field{display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:999px;padding:0 8px 0 18px;min-height:48px}
  .field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;letter-spacing:.02em;color:var(--ink);outline:none;padding:0}
  .field input::placeholder{color:var(--mute)}
  .field .ic{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .field .ic svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .row::-webkit-scrollbar{display:none}
  .row .pill{flex:none;min-height:36px;padding:0 14px}

  .ringwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ring{position:relative;width:min(100%,340px);aspect-ratio:1;max-width:100%}
  .ring .track{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
  .node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--pill);border:1px solid var(--pill);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:inherit;color:var(--ink);padding:0;touch-action:manipulation;transition:transform .12s}
  .node b{font-weight:700;font-size:13px;letter-spacing:0;line-height:1}
  .node i{font-style:normal;font-size:9px;letter-spacing:.06em;color:var(--mute);margin-top:3px}
  .node.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .node.on i{color:#bbb}
  .node.bad{border-color:var(--red);color:var(--red)}
  .node.hit{transform:scale(1.08)}
  .ring.n7 .node,.ring.n8 .node{width:54px;height:54px;margin:-27px 0 0 -27px}
  .ring.n7 .node b,.ring.n8 .node b{font-size:11px}
  .ring.many .node{width:46px;height:46px;margin:-23px 0 0 -23px}
  .ring.many .node b{font-size:10px}.ring.many .node i{display:none}
  .center{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:1px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0;touch-action:manipulation}
  .center svg{width:22px;height:22px;stroke:currentColor;fill:currentColor;stroke-width:1.5;stroke-linejoin:round}
  .center.on{background:var(--ink);color:#fff}
  .ring .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:11px}

  .kbd-wrap{overflow-x:auto;border-radius:20px;background:var(--pill);padding:14px 12px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .kbd-wrap::-webkit-scrollbar{display:none}
  .kbd{position:relative;height:150px;user-select:none;touch-action:pan-x}
  .key{position:absolute;top:0;cursor:pointer;border-radius:0 0 5px 5px}
  .key.w{width:var(--w);height:150px;background:var(--wk);border:1px solid var(--wk-line);border-top:0}
  .key.b{width:calc(var(--w)*.58);height:92px;background:var(--bk);border:1px solid var(--bk);border-top:0;z-index:2}
  .key.down{transform:translateY(2px)}
  .key .oct{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:var(--mute);pointer-events:none}
  .key.rh.w{background:var(--ink);border-color:var(--ink)}
  .key.lh.w,.key.lh.b{background:var(--red);border-color:var(--red)}
  .key.rh .oct,.key.lh .oct{display:none}
  .key .lbl{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;color:#fff;line-height:1}
  .key.b .lbl{bottom:8px}
  .key .lbl b{font-size:11px;font-weight:700}
  .key.b .lbl b{font-size:9px}
  .key .lbl i{font-style:normal;font-size:8px;letter-spacing:.06em;opacity:.75}
  .key .lbl em{display:block;width:5px;height:5px;border-radius:50%;background:#fff;margin-top:2px}
  .tones{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.02em;padding:0 6px}
  .tones span:first-child{color:var(--red)}
  .tones.off{color:var(--mute)}

  .dialwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  #dial{width:min(100%,320px);height:auto;touch-action:none;cursor:pointer;display:block}
  #dial text{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.14em;fill:var(--ink)}

  .pill:disabled{opacity:.35;cursor:default}
  .drop{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px dashed var(--line);border-radius:999px;padding:0 8px 0 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer;touch-action:manipulation}
  .drop.over{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--pill)}
  .drop.has{border-style:solid;border-color:var(--pill);background:var(--pill);color:var(--ink);justify-content:space-between}
  .drop .d-empty{display:flex;align-items:center;gap:8px}
  .drop svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .drop .d-full{display:flex;align-items:center;gap:10px;width:100%}
  .drop .d-full[hidden]{display:none}
  .drop .d-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:.02em;font-size:12px}
  .drop .d-note{color:var(--red);font-weight:700}
  .drop .d-pm{display:flex;gap:4px}
  .drop .d-pm button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .step{display:flex;align-items:center;justify-content:space-between;background:var(--pill);border-radius:999px;min-height:44px;padding:0 6px 0 18px;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
  .step .pm{display:flex;gap:4px}
  .step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .big{width:100%;min-height:52px;font-size:12px}
  .big.rec.on{background:var(--red);border-color:var(--red)}
  .big .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
  .big.on .dot{background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .msg{text-align:center;color:var(--mute);letter-spacing:.06em;font-size:11px;min-height:16px}
  .msg.err{color:var(--red)}
  .takes{display:flex;flex-direction:column;gap:8px}
  .take{background:var(--pill);border-radius:22px;padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:8px}
  .take .top{display:flex;align-items:center;gap:10px;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
  .take .top .t{flex:1}
  .take .top button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
  .take .top button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .take .top button svg{width:12px;height:12px;stroke:currentColor;fill:currentColor;stroke-width:1.5}
  .take textarea{width:100%;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);resize:none;padding:0;min-height:20px;line-height:1.5;outline:none}
  .take textarea::placeholder{color:var(--mute)}
  footer{display:flex;justify-content:space-between;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:10px;padding-top:6px}
  @media (prefers-reduced-motion:reduce){.node,.key{transition:none}.big.on .dot{animation:none}}
</style>

</head>

    if(!n){ const e=document.createElement('div'); e.className='empty'; e.textContent='Enter chords'; ring.appendChild(e); return; }
    const R=50 - (n>8?8:n>=7?9:11); // % radius
    chords.forEach((c,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const b=document.createElement('button'); b.type='button'; b.className='node'+(c.ch?'':' bad'); b.style.left=(50+R*Math.cos(a))+'%'; b.style.top=(50+R*Math.sin(a))+'%';
      b.innerHTML='<b>'+esc(c.raw)+'</b><i>'+(i+1)+'</i>'; b.setAttribute('aria-label',c.raw); b.addEventListener('click',()=>select(i,true)); ring.appendChild(b); }); }
  function nodes_(){ return [...ring.querySelectorAll('.node')]; }
  function select(i,sound){ cur=i; nodes_().forEach((el,k)=>el.classList.toggle('on',k===i)); const c=chords[i], v=voicings[i];
    if(!c||!c.ch||!v){ clearKeys(); tonesEl.className='tones off'; tonesEl.innerHTML='<span>—</span><span>—</span>'; return; }
    showVoicing(c.ch,v); tonesEl.className='tones'; tonesEl.innerHTML='<span>'+esc(v.lh.map(n=>spell(c.ch,n.tone)+octOf(n.midi)).join(' '))+'</span><span>'+esc(v.rh.map(n=>spell(c.ch,n.tone)+octOf(n.midi)).join(' '))+'</span>';
    if(sound){ ac(); playNotes(v.lh.concat(v.rh),2.2,0); } }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hitNode(i,when){ const el=nodes_()[i]; if(!el) return; setTimeout(()=>{ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),110); },when*1000); }

  // ---------- transport ----------
  function stop(){ playing=false; clearTimeout(timer); timer=null; playBtn.innerHTML=ICON_PLAY; playBtn.classList.remove('on'); playBtn.setAttribute('aria-label','Play'); killAll(); }
  function play(){ if(!chords.length) return; ac(); playing=true; playBtn.innerHTML=ICON_STOP; playBtn.classList.add('on'); playBtn.setAttribute('aria-label','Stop'); let i=cur>=chords.length?0:cur;
    const step=()=>{ if(!playing) return; const beatS=60/S.bpm, secs=beatS*4; select(i,false); const v=voicings[i]; if(v) schedule(v,secs,beatS,i); i=(i+1)%chords.length; timer=setTimeout(step,secs*1000); };
    step(); setTimeout(()=>{ if(ctx&&ctx.state!=='running') note('Tap again to enable sound',true); },300); }
  function schedule(v,secs,beatS,ci){ const all=v.lh.concat(v.rh).sort((a,b)=>a.midi-b.midi);
    if(S.r==='hold'){ playNotes(all,secs+0.4,0); hitNode(ci,0); return; }
    const iv=beatS/2, n=Math.round(secs/iv); const ud=all.concat(all.slice(1,-1).reverse());
    for(let k=0;k<n;k++){ const t=k*iv, len=iv*0.95+0.08; hitNode(ci,t); if(S.r==='e') playNotes(all,len+0.1,t,0.55); else { const x=ud[k%ud.length]; playNote(x.midi,len+0.35,0.65,t); flash(x.midi,t); } } }
  playBtn.addEventListener('click',()=>{ playing?stop():play(); });
  function note(t,err){ msg.textContent=t||''; msg.className='msg'+(err?' err':''); }

  // ---------- controls ----------
  document.querySelectorAll('[data-tone]').forEach(b=>b.addEventListener('click',()=>{ if(b.disabled) return; setTone(b.dataset.tone); ac(); }));
  document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{ S.style=b.dataset.style; document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x===b)); rebuild(true); }));
  document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{ S.r=b.dataset.r; document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b)); }));
  function setBpm(v){ S.bpm=Math.max(40,Math.min(200,v)); $('bpmV').textContent=S.bpm; applyFx(); save(); }
  $('bpmDn').addEventListener('click',()=>setBpm(S.bpm-4)); $('bpmUp').addEventListener('click',()=>setBpm(S.bpm+4));
  let deb=null; progEl.addEventListener('input',()=>{ clearTimeout(deb); deb=setTimeout(()=>rebuild(true),250); });
  progEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); progEl.blur(); rebuild(false); } });
  const genres=$('genres'); Object.keys(LIB).forEach(g=>{ const b=document.createElement('button'); b.type='button'; b.className='pill soft'; b.textContent=g; b.addEventListener('click',()=>loadFrom(g)); genres.appendChild(b); });
  function loadFrom(g){ const list=LIB[g]; let p; do{ p=list[Math.floor(Math.random()*list.length)]; }while(p===progEl.value&&list.length>1); progEl.value=p; stop(); rebuild(false); }
  $('rnd').addEventListener('click',()=>{ const ks=Object.keys(LIB); loadFrom(ks[Math.floor(Math.random()*ks.length)]); });
  document.addEventListener('keydown',e=>{ if(e.target===progEl||e.target.tagName==='TEXTAREA') return; if(e.key==='ArrowRight'&&chords.length){ e.preventDefault(); select((cur+1)%chords.length,true); } if(e.key==='ArrowLeft'&&chords.length){ e.preventDefault(); select((cur-1+chords.length)%chords.length,true); } });
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ if(ctx&&ctx.state!=='running') ctx.resume().then(()=>note('')); },{passive:true}));

  // ---------- dial (3 arms) ----------
  const dial=$('dial'); const C=160, R_OUT=150, A0=22, A1=112; const ARMS=[{k:'cut',name:'CUT',ang:-90},{k:'space',name:'SPACE',ang:150},{k:'drive',name:'DRIVE',ang:30}];
  const NS='http://www.w3.org/2000/svg'; const el=(n,attrs)=>{ const e=document.createElementNS(NS,n); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };
  function buildDial(){ dial.innerHTML=''; const defs=el('defs',{}); defs.innerHTML='<radialGradient id="g1" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#F4F4F4"/><stop offset="1" stop-color="#D6D6D6"/></radialGradient>'; dial.appendChild(defs);
    dial.appendChild(el('circle',{cx:C,cy:C,r:R_OUT,fill:'none',stroke:'#111',"stroke-width":1}));
    dial.appendChild(el('circle',{cx:C,cy:C,r:72,fill:'url(#g1)'}));
    for(const a of ARMS){ const rad=a.ang*Math.PI/180, dx=Math.cos(rad), dy=Math.sin(rad);
      dial.appendChild(el('line',{x1:C+dx*A0,y1:C+dy*A0,x2:C+dx*A1,y2:C+dy*A1,stroke:'#CFCFCF',"stroke-width":18,"stroke-linecap":'round'}));
      for(let i=0;i<=4;i++){ const rr=A0+(A1-A0)*i/4; dial.appendChild(el('circle',{cx:C+dx*rr,cy:C+dy*rr,r:2,fill:'#9A9A9A'})); }
      const knob=el('circle',{cx:C,cy:C,r:9,fill:'#111'}); knob.dataset.k=a.k; a.knob=knob; dial.appendChild(knob);
      const lr=R_OUT-16; const tx=C+dx*lr, ty=C+dy*lr; let rot=a.ang+90; if(rot>90) rot-=180; if(a.ang===-90) rot=0;
      const t=el('text',{x:tx,y:ty,"text-anchor":'middle',"dominant-baseline":'middle',transform:'rotate('+rot+' '+tx+' '+ty+')'}); a.txt=t; dial.appendChild(t); }
    drawDial(); }
  function drawDial(){ for(const a of ARMS){ const v=S[a.k]; const rad=a.ang*Math.PI/180; const rr=A0+(A1-A0)*v; a.knob.setAttribute('cx',C+Math.cos(rad)*rr); a.knob.setAttribute('cy',C+Math.sin(rad)*rr);
      const disp=a.k==='cut'?(cutoffHz()>=1000?(cutoffHz()/1000).toFixed(1)+'K':Math.round(cutoffHz())):Math.round(v*100); a.txt.textContent=a.name+' '+disp; } }
  let dialArm=null; function dialPt(e){ const r=dial.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*320,y:(e.clientY-r.top)/r.height*320}; }
  function dialSet(p,armOnly){ const vx=p.x-C, vy=p.y-C; let arm=armOnly; if(!arm){ let bd=Infinity; for(const a of ARMS){ const rad=a.ang*Math.PI/180; const proj=vx*Math.cos(rad)+vy*Math.sin(rad); const perp=Math.abs(-vx*Math.sin(rad)+vy*Math.cos(rad)); const d=perp+(proj<0?1000:0); if(d<bd){bd=d;arm=a;} } }
    const rad=arm.ang*Math.PI/180; const proj=vx*Math.cos(rad)+vy*Math.sin(rad); S[arm.k]=Math.max(0,Math.min(1,(proj-A0)/(A1-A0))); drawDial(); applyFx(); return arm; }
  dial.addEventListener('pointerdown',e=>{ e.preventDefault(); dial.setPointerCapture(e.pointerId); ac(); dialArm=dialSet(dialPt(e)); });
  dial.addEventListener('pointermove',e=>{ if(dialArm) dialSet(dialPt(e),dialArm); }); ['pointerup','pointercancel'].forEach(ev=>dial.addEventListener(ev,()=>{ dialArm=null; save(); }));
  dial.addEventListener('keydown',e=>{ const m={ArrowUp:['cut',0.05],ArrowDown:['cut',-0.05],ArrowLeft:['space',-0.05],ArrowRight:['space',0.05]}[e.key]; if(!m) return; e.preventDefault(); S[m[0]]=Math.max(0,Math.min(1,S[m[0]]+m[1])); drawDial(); applyFx(); });

  // ---------- rec ----------
  const recBtn=$('rec'), recT=$('recT'), takesEl=$('takes'), langBtn=$('lang'), withBtn=$('withProg'); const LANGS=[['KO','ko-KR'],['EN','en-US'],['粵','yue-Hant-HK']]; let withProg=true;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null, stream=null, chunks=[], t0=0, tick=null, recog=null, fin='', inter='', takes=[], takeN=0, playingTake=null;
  langBtn.addEventListener('click',()=>{ S.lang=(S.lang+1)%LANGS.length; langBtn.textContent=LANGS[S.lang][0]; save(); });
  withBtn.classList.add('on'); withBtn.addEventListener('click',()=>{ withProg=!withProg; withBtn.classList.toggle('on',withProg); });
  function fmt(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  async function startRec(){ ac(); try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false}}); }
    catch(e){ const nm=e&&e.name||''; if(nm==='NotFoundError') note('No microphone found',true); else if(window.top!==window.self) note('Mic blocked in preview — open in a new tab',true); else note('Mic blocked — allow it in the address bar',true); return; }
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
    try{ rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); }catch(e){ note('Recording not supported here',true); stream.getTracks().forEach(t=>t.stop()); return; }
    chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.onstop=finishRec; fin=''; inter='';
    if(SR){ try{ recog=new SR(); recog.lang=LANGS[S.lang][1]; recog.continuous=true; recog.interimResults=true; let done='';
      recog.onresult=ev=>{ let f='',i=''; for(let k=0;k<ev.results.length;k++){ const r=ev.results[k]; if(r.isFinal) f+=r[0].transcript+' '; else i+=r[0].transcript; } fin=done+f; inter=i; note((fin+inter).trim().slice(-60)||'…'); };
      recog.onend=()=>{ if(rec&&rec.state==='recording'){ done=fin; try{recog.start();}catch(e){} } }; recog.onerror=()=>{}; recog.start(); }catch(e){ recog=null; } }
    if(withProg&&chords.length){ stop(); cur=0; play(); }
    rec.start(100); t0=performance.now(); tick=setInterval(()=>{ recT.textContent=fmt((performance.now()-t0)/1000); },250); recBtn.classList.add('on'); recT.textContent='00:00'; }
  function stopRec(){ if(rec&&rec.state!=='inactive') rec.stop(); if(recog){ try{ recog.onend=null; recog.stop(); }catch(e){} } if(withProg) stop(); }
  async function finishRec(){ clearInterval(tick); recBtn.classList.remove('on'); recT.textContent='Rec'; note(''); const dur=(performance.now()-t0)/1000; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null;
    const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}); rec=null; if(!blob.size||dur<0.4) return; let buf=null; try{ buf=await ac().decodeAudioData(await blob.arrayBuffer()); }catch(e){ note('Could not decode take',true); return; }
    takeN++; takes.unshift({id:takeN,name:'Take '+String(takeN).padStart(2,'0'),buf,dur:buf.duration,text:(fin+inter).trim(),prog:progEl.value,src:null}); recog=null; renderTakes(); }
  function renderTakes(){ takesEl.innerHTML=''; for(const t of takes){ const d=document.createElement('div'); d.className='take';
      d.innerHTML='<div class="top"><span class="t">'+esc(t.name)+' · '+fmt(t.dur)+'</span><button type="button" data-a="play" aria-label="Play take" class="'+(playingTake===t?'on':'')+'">'+(playingTake===t?ICON_STOP:ICON_PLAY)+'</button><button type="button" data-a="del" aria-label="Delete take"><svg viewBox="0 0 24 24" style="fill:none"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><textarea rows="1" placeholder="'+(SR?'No words caught':'Speech-to-text unavailable')+'" aria-label="Lyrics"></textarea>';
      const ta=d.querySelector('textarea'); ta.value=t.text; const grow=()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }; ta.addEventListener('input',()=>{ t.text=ta.value; grow(); }); setTimeout(grow,0);
      d.querySelector('[data-a=play]').addEventListener('click',()=>{ playingTake===t?stopTake():playTake(t); }); d.querySelector('[data-a=del]').addEventListener('click',()=>{ if(playingTake===t) stopTake(); takes=takes.filter(x=>x!==t); renderTakes(); }); takesEl.appendChild(d); } }
  function playTake(t){ stopTake(); const c=ac(); const s=c.createBufferSource(); s.buffer=t.buf; s.connect(master); s.start(); t.src=s; playingTake=t; s.onended=()=>{ if(playingTake===t){ playingTake=null; t.src=null; if(withProg) stop(); renderTakes(); } };
    if(withProg&&chords.length){ if(t.prog!==progEl.value){ progEl.value=t.prog; } stop(); rebuild(false); cur=0; play(); } renderTakes(); }
  function stopTake(){ if(playingTake){ const t=playingTake; playingTake=null; try{ t.src.onended=null; t.src.stop(); }catch(e){} t.src=null; if(withProg) stop(); renderTakes(); } }
  recBtn.addEventListener('click',()=>{ rec&&rec.state==='recording'?stopRec():startRec(); });

  // ---------- sample ----------
  let sample=null; const drop=$('drop'), dFile=$('dFile'), dEmpty=$('dEmpty'), dFull=$('dFull'), dName=$('dName'), dNote=$('dNote'), tSample=$('tSample');
  const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; const nn=m=>NAMES[((m%12)+12)%12]+octOf(m);
  function detectPitch(buf){ const sr=buf.sampleRate; const ch=buf.numberOfChannels; const L=buf.length; const x=new Float32Array(L); for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<L;i++) x[i]+=d[i]/ch; }
    let peak=0; for(let i=0;i<L;i++) peak=Math.max(peak,Math.abs(x[i])); if(!peak) return {midi:60,gain:1};
    let on=0; while(on<L&&Math.abs(x[on])<peak*0.1) on++; const N=Math.min(8192,L-on); let start=Math.min(on+Math.floor(sr*0.03),L-N); if(start<0) start=0; if(N<1024) return {midi:60,gain:0.8/peak};
    const seg=x.subarray(start,start+N); const minLag=Math.floor(sr/1000), maxLag=Math.min(Math.floor(sr/40),N>>1); const r=new Float32Array(maxLag+1); let e0=0; for(let i=0;i<N-maxLag;i++) e0+=seg[i]*seg[i];
    for(let lag=minLag;lag<=maxLag;lag++){ let num=0,e1=0; for(let i=0;i<N-maxLag;i++){ num+=seg[i]*seg[i+lag]; e1+=seg[i+lag]*seg[i+lag]; } r[lag]=num/Math.sqrt(e0*e1+1e-9); }
    let best=0; for(let lag=minLag;lag<=maxLag;lag++) best=Math.max(best,r[lag]); let pick=0; for(let lag=minLag+1;lag<maxLag;lag++){ if(r[lag]>=best*0.9&&r[lag]>r[lag-1]&&r[lag]>=r[lag+1]){ pick=lag; break; } } if(!pick) return {midi:60,gain:0.8/peak};
    const y0=r[pick-1],y1=r[pick],y2=r[pick+1]; const den=(y0-2*y1+y2); const shift=den?0.5*(y0-y2)/den:0; const f=sr/(pick+shift); return {midi:Math.round(69+12*Math.log2(f/440)),gain:0.8/peak}; }
  async function loadSample(file){ if(!file) return; note('Analysing…'); try{ const ab=await file.arrayBuffer(); const buf=await ac().decodeAudioData(ab.slice(0)); const p=detectPitch(buf); sample={buf,midi:p.midi,gain:p.gain,name:file.name.replace(/\.[^.]+$/,'')};
      idbPut({name:file.name,type:file.type,data:ab}).catch(()=>{}); showSample(); setTone('sample'); note(''); }
    catch(e){ note('Could not read that file',true); } }
  function showSample(){ const has=!!sample; drop.classList.toggle('has',has); dEmpty.hidden=has; dFull.hidden=!has; tSample.disabled=!has; if(has){ dName.textContent=sample.name; dNote.textContent=nn(sample.midi); } else if(S.tone==='sample') setTone('piano'); }
  function setTone(t){ S.tone=t; document.querySelectorAll('[data-tone]').forEach(x=>x.classList.toggle('on',x.dataset.tone===t)); save(); }
  drop.addEventListener('click',e=>{ if(e.target.closest('button')) return; dFile.click(); }); drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); dFile.click(); } });
  dFile.addEventListener('change',()=>{ loadSample(dFile.files[0]); dFile.value=''; });
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); })); ['dragleave','dragend'].forEach(ev=>document.addEventListener(ev,e=>{ if(!e.relatedTarget) drop.classList.remove('over'); }));
  document.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); const f=[...(e.dataTransfer&&e.dataTransfer.files||[])].find(f=>/^audio\//.test(f.type)||/\.(wav|mp3|m4a|aac|ogg|flac|aif|aiff|webm)$/i.test(f.name)); if(f) loadSample(f); else note('Drop an audio file',true); });
  $('dDn').addEventListener('click',()=>{ if(sample){ sample.midi--; showSample(); playNote(60,1.2,0.7); } }); $('dUp').addEventListener('click',()=>{ if(sample){ sample.midi++; showSample(); playNote(60,1.2,0.7); } });
  $('dX').addEventListener('click',()=>{ sample=null; showSample(); idbDel().catch(()=>{}); });
  function idb(){ return new Promise((res,rej)=>{ try{ const q=indexedDB.open('skm-voicing',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }catch(e){ rej(e); } }); }
  async function idbPut(v){ const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').put(v,'sample'); }
  async function idbDel(){ const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').delete('sample'); }
  async function idbGet(){ const db=await idb(); return new Promise(res=>{ const r=db.transaction('kv').objectStore('kv').get('sample'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }
  (async()=>{ try{ const v=await idbGet(); if(v&&v.data){ const buf=await ac().decodeAudioData(v.data.slice(0)); const p=detectPitch(buf); sample={buf,midi:p.midi,gain:p.gain,name:v.name.replace(/\.[^.]+$/,'')}; showSample(); if(S.tone==='sample') setTone('sample'); } else if(S.tone==='sample') setTone('piano'); }catch(e){ if(S.tone==='sample') setTone('piano'); } })();

  // ---------- persist ----------
  function save(){ try{ localStorage.setItem('skm.voicing',JSON.stringify({p:progEl.value,style:S.style,tone:S.tone,bpm:S.bpm,cut:S.cut,space:S.space,drive:S.drive,lang:S.lang})); }catch(e){} }
  function load(){ try{ const j=JSON.parse(localStorage.getItem('skm.voicing')||'null'); if(!j) return; if(j.p) progEl.value=j.p; ['style','tone','bpm','cut','space','drive','lang'].forEach(k=>{ if(j[k]!=null) S[k]=j[k]; }); }catch(e){} }
  function syncUI(){ document.querySelectorAll('[data-tone]').forEach(x=>x.classList.toggle('on',x.dataset.tone===S.tone)); document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x.dataset.style===S.style)); $('bpmV').textContent=S.bpm; langBtn.textContent=LANGS[S.lang][0]; }
  window.addEventListener('message',e=>{ if(e.data&&e.data.skm==='stop'){ stop(); if(rec&&rec.state==='recording') stopRec(); } });
  buildKeys(); load(); syncUI(); buildDial(); rebuild(false);
})();
</script>
